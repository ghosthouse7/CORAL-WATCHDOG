name: docker
version: 0.1.0
dsl_version: 3
backend: http

inputs:
  DOCKER_API_BASE:
    kind: variable
    default: http://localhost:2375
    hint: "Docker Engine HTTP API base URL"

base_url: "{{input.DOCKER_API_BASE}}"

test_queries:
  - SELECT "Id", "Status", "Image" FROM docker.containers LIMIT 1

tables:
  - name: containers
    description: "All Docker containers including stopped and exited ones"
    request:
      method: GET
      path: /containers/json?all=true
    response:
      rows_path: []
    columns:
      - name: Id
        type: Utf8
      - name: Image
        type: Utf8
      - name: Status
        type: Utf8
      - name: State
        type: Utf8
      - name: Created
        type: Int64
      - name: Command
        type: Utf8

  - name: running
    description: "Only currently running containers"
    request:
      method: GET
      path: /containers/json
    response:
      rows_path: []
    columns:
      - name: Id
        type: Utf8
      - name: Image
        type: Utf8
      - name: Status
        type: Utf8
      - name: State
        type: Utf8
      - name: Created
        type: Int64